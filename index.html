<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺灣五大地形 課堂出拳挑戰賽</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }
        body {
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #0f172a;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 1.35rem;
            color: #dc2626;
            font-weight: bold;
            margin-bottom: 20px;
            height: 35px;
            text-align: center;
        }
        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1050px;
            width: 100%;
        }

        /* 臺灣真實地圖容器 */
        .map-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            position: relative;
            width: 420px;
            height: 580px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* 真實臺灣地圖底圖 */
        .taiwan-map-bg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.95;
        }

        /* 地形地標熱點 (Hotspots) */
        .hotspot {
            position: absolute;
            background: #ffffff;
            border: 2px solid #2563eb;
            color: #1e3a8a;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            user-select: none;
        }
        .hotspot:hover {
            background: #2563eb;
            color: #ffffff;
            transform: scale(1.12);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            z-index: 10;
        }
        .hotspot::before {
            content: '📍';
            font-size: 0.95rem;
        }

        /* 熱點精確地理定位 (基於底圖座標) */
        #spot-taipei  { top: 12%; left: 58%; border-color: #ca8a04; color: #854d0e; } /* 臺北/士林 */
        #spot-taoyuan { top: 15%; left: 35%; border-color: #9333ea; color: #6b21a8; } /* 桃園台地 */
        #spot-miaoli  { top: 25%; left: 30%; border-color: #0284c7; color: #075985; } /* 苗栗丘陵 */
        #spot-puli    { top: 40%; left: 45%; border-color: #db2777; color: #9d174d; } /* 埔里盆地 */
        #spot-jianan  { top: 52%; left: 22%; border-color: #ea580c; color: #9a3412; } /* 嘉南平原 */
        #spot-mountain{ top: 48%; left: 56%; border-color: #16a34a; color: #14532d; } /* 中央山脈 */
        #spot-fangliao{ top: 74%; left: 38%; border-color: #0d9488; color: #115e59; } /* 屏東枋寮 */

        /* 右側儀表板 */
        .dashboard {
            flex: 1;
            min-width: 320px;
            background: white;
            border-radius: 20px;
            padding: 25px 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .timer-box {
            font-size: 5.5rem;
            font-weight: 900;
            color: #ef4444;
            margin: 10px 0;
            line-height: 1;
        }
        .btn-timer {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn-timer:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        /* 地形類別圖例說明 */
        .legend-box {
            margin-top: 25px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: left;
            font-size: 0.9rem;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            color: #334155;
        }

        /* 揭曉彈窗 Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 520px;
            border-radius: 24px;
            padding: 25px 30px;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }
        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #94a3b8;
        }
        .close-btn:hover { color: #0f172a; }
        .result-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 14px;
            background: #e2e8f0;
            margin: 15px 0;
        }
        .badge {
            display: inline-block;
            background: #ef4444;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 30px;
            margin-bottom: 8px;
        }
        .gesture-hint {
            font-size: 1.2rem;
            color: #1d4ed8;
            font-weight: bold;
            background: #eff6ff;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .explanation {
            font-size: 1rem;
            color: #334155;
            line-height: 1.6;
            text-align: left;
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>🗺️ 臺灣地形大挑戰：看題出拳！</h1>
    <div class="subtitle" id="hover-status">把滑鼠移到地圖點位上選區域...</div>

    <div class="main-layout">
        <!-- 臺灣真實地圖 + 7 個精準地理熱點 -->
        <div class="map-card">
            <img class="taiwan-map-bg" src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Taiwan_location_map.svg/600px-Taiwan_location_map.svg.png" alt="臺灣地圖">
            
            <div class="hotspot" id="spot-taipei" onmouseenter="showHover('臺北盆地 (士林區)')" onmouseleave="clearHover()" onclick="openCard('taipei')">臺北/士林</div>
            <div class="hotspot" id="spot-taoyuan" onmouseenter="showHover('桃園台地 / 林口台地')" onmouseleave="clearHover()" onclick="openCard('taoyuan')">桃園台地</div>
            <div class="hotspot" id="spot-miaoli" onmouseenter="showHover('苗栗丘陵 / 石碇茶區')" onmouseleave="clearHover()" onclick="openCard('miaoli')">苗栗丘陵</div>
            <div class="hotspot" id="spot-puli" onmouseenter="showHover('埔里盆地 (南投)')" onmouseleave="clearHover()" onclick="openCard('puli')">埔里盆地</div>
            <div class="hotspot" id="spot-jianan" onmouseenter="showHover('嘉南平原 / 宜蘭平原')" onmouseleave="clearHover()" onclick="openCard('jianan')">嘉南平原</div>
            <div class="hotspot" id="spot-mountain" onmouseenter="showHover('中央山脈 (山地)')" onmouseleave="clearHover()" onclick="openCard('mountain')">中央山脈</div>
            <div class="hotspot" id="spot-fangliao" onmouseenter="showHover('屏東沿海平原 (枋寮)')" onmouseleave="clearHover()" onclick="openCard('fangliao')">屏東枋寮</div>
        </div>

        <!-- 倒數計時器與顏色圖例 -->
        <div class="dashboard">
            <h2 style="margin: 0; color: #0f172a;">⏱️ 倒數出拳計時器</h2>
            <div class="timer-box" id="timer">5</div>
            <button class="btn-timer" onclick="startTimer()">▶️ 開始 5 秒倒數</button>
            <p style="color: #64748b; margin-top: 15px; font-size: 0.95rem;">
                點擊地圖前，先按開始倒數！<br>倒數歸零時全班手勢定格！
            </p>

            <div class="legend-box">
                <div class="legend-item">🥣 盆地：臺北 / 埔里</div>
                <div class="legend-item">凸 台地：桃園 / 林口</div>
                <div class="legend-item">〰️ 丘陵：苗栗 / 石碇</div>
                <div class="legend-item">🖐️ 平原：嘉南 / 宜蘭</div>
                <div class="legend-item">⛰️ 山地：中央山脈</div>
                <div class="legend-item">🐟 沿海平原：屏東枋寮</div>
            </div>
        </div>
    </div>

    <!-- 揭曉答案 Modal 彈窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCard()">&times;</span>
            <h2 id="m-title" style="margin: 5px 0 10px 0; color: #0f172a;">地區名稱</h2>
            <div><span class="badge" id="m-landform">地形類別</span></div>
            <div class="gesture-hint" id="m-gesture">手勢：--</div>
            
            <img id="m-img" class="result-img" src="" alt="地形圖片">

            <div class="explanation" id="m-desc">解釋說明載入中...</div>
        </div>
    </div>

    <script>
        const data = {
            taipei: {
                title: "臺北市士林區 (臺北盆地)",
                landform: "盆地",
                gesture: "👊 雙手向內捧成碗狀 🥣",
                img: "https://images.unsplash.com/photo-1541872703-74c5e44368f9?w=700&auto=format&fit=crop",
                desc: "<b>考題常見描述：</b>四周被陽明山與雪山山脈包圍，中間地勢低平。<br><b>生活應用：</b>人口密集、大樓林立（如台北101、蘭雅國小周邊），交通網路便利。"
            },
            puli: {
                title: "南投縣埔里鎮 (埔里盆地)",
                landform: "盆地",
                gesture: "👊 雙手向內捧成碗狀 🥣",
                img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=700&auto=format&fit=crop", 
                desc: "<b>考題常見描述：</b>位於臺灣正中央的山間低窪平地，四周全是高山。<br><b>生活應用：</b>氣候溫和，農業與花卉栽培十分發達。"
            },
            taoyuan: {
                title: "桃園市 / 林口地區 (桃園台地)",
                landform: "台地",
                gesture: "👊 一手橫平一手豎立 (T字型) 凸",
                img: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=700&auto=format&fit=crop", 
                desc: "<b>考題常見描述：</b>地勢比平原高，頂部像桌子一樣平坦，但邊緣有陡坡。<br><b>生活應用：</b>早期多開闢埤塘蓄水，現今多發展為工業區與新市鎮。"
            },
            miaoli: {
                title: "苗栗縣 / 新北石碇區 (苗栗丘陵)",
                landform: "丘陵",
                gesture: "👊 手掌上下做微幅波浪 〰️",
                img: "https://images.unsplash.com/photo-1586348943529-beaae6c28db9?w=700&auto=format&fit=crop", 
                desc: "<b>考題常見描述：</b>高度低於 1000 公尺，地形起伏緩和。<br><b>生活應用：</b>坡地排水良好，非常適合開闢茶園（如石碇包種茶）與果園（採水果）。"
            },
            jianan: {
                title: "嘉南平原 / 宜蘭平原",
                landform: "平原",
                gesture: "👊 雙手平平對接 🖐️",
                img: "https://images.unsplash.com/photo-1500937386664-56d1dfef3854?w=700&auto=format&fit=crop", 
                desc: "<b>考題常見描述：</b>地勢低平廣闊，由河流攜帶泥沙沖積而成。<br><b>生活應用：</b>臺灣最大的米倉與農業基地，適合大面積種植稻米與蔬果。"
            },
            fangliao: {
                title: "屏東縣枋寮鄉 (沿海平原)",
                landform: "平原",
                gesture: "👊 雙手平平對接 🖐️",
                img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=700&auto=format&fit=crop", 
                desc: "<b>考題常見描述：</b>靠近海洋的平坦土地。<br><b>生活應用：</b>居民利用平坦地形與海水資源挖設魚塭發展養殖漁業，或種植蓮霧、芒果。"
            },
            mountain: {
                title: "中央山脈 / 玉山 / 陽明山",
                landform: "山地",
                gesture: "👊 雙手合十指尖向上 (尖頂山峰) ⛰️",
                img: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=700&auto=format&fit=crop", 
                desc: "<b>考題常見描述：</b>海拔在 1000 公尺以上，地勢高聳、坡度陡峭。<br><b>生活應用：</b>水土保持重要區域，擁有豐富的森林生態資源與觀光勝地。"
            }
        };

        function showHover(name) {
            document.getElementById('hover-status').innerText = `👉 要點開【${name}】囉！不可以偷變拳喔！`;
        }

        function clearHover() {
            document.getElementById('hover-status').innerText = "把滑鼠移到地圖點位上選區域...";
        }

        function openCard(key) {
            const item = data[key];
            if (!item) return;

            document.getElementById('m-title').innerText = item.title;
            document.getElementById('m-landform').innerText = item.landform;
            document.getElementById('m-gesture').innerText = item.gesture;
            document.getElementById('m-img').src = item.img;
            document.getElementById('m-desc').innerHTML = item.desc;

            document.getElementById('modal').style.display = 'flex';
        }

        function closeCard() {
            document.getElementById('modal').style.display = 'none';
        }

        let timerInterval;
        function startTimer() {
            let count = 5;
            const timerEl = document.getElementById('timer');
            timerEl.innerText = count;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    timerEl.innerText = count;
                } else {
                    timerEl.innerText = "定格！";
                    clearInterval(timerInterval);
                }
            }, 1000);
        }
    </script>
</body>
</html>
