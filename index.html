<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣地形互動測驗</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh; background-color: #0f172a; overflow: hidden;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: #f8fafc;
    }
    
    #map-wrapper { width: 100%; height: 100%; cursor: grab; position: relative; }
    #map-wrapper:active { cursor: grabbing; }
    #map-container { width: 100%; height: 100%; transform-origin: 0 0; }
    svg { width: 100%; height: 100%; object-fit: contain; }

    /* 強制穿透 */
    svg * { pointer-events: none !important; }
    
    /* 只有行政區塊允許被點擊 */
    svg path {
      pointer-events: auto !important;
      transition: fill 0.2s, filter 0.2s;
      cursor: pointer; stroke: #ffffff; stroke-width: 1px;
    }
    svg path:hover {
      fill: #fcd34d !important;
      filter: drop-shadow(0 0 12px rgba(252, 211, 77, 0.8));
    }
    
    /* 隱藏無用標籤文字或裝飾框 */
    text, #box { 
      display: none !important; 
    }

    /* 解答彈出視窗 */
    #modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: none; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; transition: opacity 0.3s;
    }
    #answer-modal {
      background: #ffffff; color: #0f172a;
      padding: 40px; border-radius: 24px;
      width: 90%; max-width: 800px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 25px 35px -5px rgba(0,0,0,0.6);
      position: relative; transform: translateY(20px); transition: transform 0.3s;
    }
    #modal-overlay.active { display: flex; opacity: 1; }
    #modal-overlay.active #answer-modal { transform: translateY(0); }
    
    .close-btn {
      position: absolute; top: 20px; right: 25px;
      font-size: 32px; cursor: pointer; color: #94a3b8; transition: color 0.2s;
    }
    .close-btn:hover { color: #ef4444; }
    
    .modal-title { font-size: 36px; font-weight: bold; margin-bottom: 16px; color: #1d4ed8; }
    .modal-reason { font-size: 20px; font-weight: bold; color: #b45309; margin-bottom: 20px; background: #fef3c7; padding: 14px 18px; border-radius: 10px; }
    .modal-desc { font-size: 20px; line-height: 1.8; margin-bottom: 25px; color: #334155; }
    
    /* 圖片自動縮放且不跑版機制 */
    .modal-img-placeholder {
      width: 100%; height: 360px;
      background: #e2e8f0; border: 3px dashed #cbd5e1;
      border-radius: 16px; display: flex; justify-content: center; align-items: center;
      color: #64748b; font-weight: bold; font-size: 20px; overflow: hidden;
    }
    .modal-img-placeholder img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .hint {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
      font-size: 18px; background: rgba(30, 41, 59, 0.9); padding: 12px 24px;
      border-radius: 30px; pointer-events: none; z-index: 100;
    }
  </style>
</head>
<body>

  <div id="modal-overlay">
    <div id="answer-modal">
      <div class="close-btn" onclick="closeModal()">✖</div>
      <div class="modal-title" id="m-title">載入中...</div>
      <div class="modal-reason" id="m-reason">載入中...</div>
      <div class="modal-desc" id="m-desc">載入中...</div>
      <div class="modal-img-placeholder" id="m-img">🖼️ 請在此處插入圖片</div>
    </div>
  </div>

  <div id="map-wrapper">
    <div id="map-container"></div>
  </div>
  <div class="hint">👆 點擊地圖區塊顯示地形・滾輪縮放・按住拖曳</div>

  <script>
    // --- 1. 精準比對庫 (涵蓋全台22縣市) ---
    const keywordMapping = {
      '基隆': { key: 'keelung', name: '基隆市' }, '10017': { key: 'keelung', name: '基隆市' },
      '臺北': { key: 'taipei', name: '臺北市' }, '台北': { key: 'taipei', name: '臺北市' }, '63000': { key: 'taipei', name: '臺北市' },
      '新北': { key: 'taipei', name: '新北市' }, '65000': { key: 'taipei', name: '新北市' },
      '桃園': { key: 'taoyuan', name: '桃園市' }, '68000': { key: 'taoyuan', name: '桃園市' },
      '新竹市': { key: 'zhumiao', name: '新竹市' }, '10018': { key: 'zhumiao', name: '新竹市' },
      '新竹縣': { key: 'zhumiao', name: '新竹縣' }, '10004': { key: 'zhumiao', name: '新竹縣' },
      '新竹': { key: 'zhumiao', name: '新竹' },
      '苗栗': { key: 'zhumiao', name: '苗栗縣' }, '10005': { key: 'zhumiao', name: '苗栗縣' },
      '臺中': { key: 'taichung', name: '臺中市' }, '台中': { key: 'taichung', name: '臺中市' }, '66000': { key: 'taichung', name: '臺中市' },
      '彰化': { key: 'changhua', name: '彰化縣' }, '10007': { key: 'changhua', name: '彰化縣' },
      '南投': { key: 'nantou', name: '南投縣' }, '10008': { key: 'nantou', name: '南投縣' },
      '嘉義市': { key: 'jianan', name: '嘉義市' }, '10020': { key: 'jianan', name: '嘉義市' },
      '嘉義縣': { key: 'jianan', name: '嘉義縣' }, '10010': { key: 'jianan', name: '嘉義縣' },
      '嘉義': { key: 'jianan', name: '嘉義' },
      '雲林': { key: 'jianan', name: '雲林縣' }, '10009': { key: 'jianan', name: '雲林縣' },
      '臺南': { key: 'jianan', name: '臺南市' }, '台南': { key: 'jianan', name: '臺南市' }, '67000': { key: 'jianan', name: '臺南市' },
      '高雄': { key: 'kaoping', name: '高雄市' }, '64000': { key: 'kaoping', name: '高雄市' },
      '屏東': { key: 'kaoping', name: '屏東縣' }, '10013': { key: 'kaoping', name: '屏東縣' },
      '宜蘭': { key: 'yilan', name: '宜蘭縣' }, '10002': { key: 'yilan', name: '宜蘭縣' },
      '花蓮': { key: 'huadong', name: '花蓮縣' }, '10015': { key: 'huadong', name: '花蓮縣' },
      '臺東': { key: 'huadong', name: '臺東縣' }, '台東': { key: 'huadong', name: '臺東縣' }, '10014': { key: 'huadong', name: '臺東縣' },
      '澎湖': { key: 'penghu', name: '澎湖縣' }, '10016': { key: 'penghu', name: '澎湖縣' },
      '金門': { key: 'kinmen', name: '金門縣' }, '09020': { key: 'kinmen', name: '金門縣' },
      '連江': { key: 'matsu', name: '連江縣' }, '馬祖': { key: 'matsu', name: '連江縣' }, '09007': { key: 'matsu', name: '連江縣' }
    };

    // --- 2. 地形題庫 ---
    const geoData = {
      'keelung': { title: '谷灣式海岸 (岬灣地形)', reason: '丘陵沉降、海水入侵', desc: '海岸線曲折，水深利於建港，為北臺灣重要良港。' },
      'taipei': { title: '臺北盆地', reason: '斷層陷落與河流沖積', desc: '四周被火山與山脈環繞。因地形封閉，夏季易產生悶熱的盆地效應。' },
      'taoyuan': { title: '桃園臺地', reason: '古石門溪沖積扇隆起', desc: '地勢平坦。因缺乏大型河川，先民廣建「埤塘」蓄水，形成千塘之鄉。' },
      'zhumiao': { title: '竹苗丘陵', reason: '河川切割與地殼抬升', desc: '地勢起伏和緩，氣候適合茶樹生長，是東方美人茶產地。' },
      'taichung': { title: '臺中盆地 / 大肚臺地', reason: '板塊擠壓與斷層作用', desc: '全臺最大盆地，西緣隆起了大肚臺地。氣候溫和為農業與都會樞紐。' },
      'changhua': { title: '彰化平原', reason: '濁水溪等河川沖積', desc: '土壤肥沃且有八堡圳灌溉，農業發達，素有「臺灣穀倉」美譽。' },
      'nantou': { title: '埔里盆地', reason: '斷層陷落 / 板塊擠壓', desc: '全臺唯一不靠海的縣市，境內多高山，並有著名的埔里盆地。' },
      'jianan': { title: '嘉南平原', reason: '多條河川長期沖積', desc: '臺灣最大平原！沿岸地勢低平，常有沙洲與潟湖地形，早期多闢為鹽田。' },
      'kaoping': { title: '高屏平原 / 恆春半島', reason: '高屏溪沖積 / 珊瑚礁隆起', desc: '最南端恆春半島佈滿珊瑚礁石灰岩，熱帶氣候顯著。' },
      'yilan': { title: '蘭陽平原', reason: '蘭陽溪沖積扇', desc: '地形呈向海開口的畚箕狀。冬季迎東北季風，降雨豐沛。' },
      'huadong': { title: '花東縱谷 / 海岸山脈', reason: '板塊擠壓', desc: '縱谷夾在中央與海岸山脈間，呈狹長形平原；海岸山脈為板塊擠壓隆起。' },
      'penghu': { title: '澎湖群島 (玄武岩方山)', reason: '火山噴發與玄武岩熔岩冷卻', desc: '主要由火山熔岩冷卻形成，地形平坦呈方山狀。擁有壯麗的柱狀玄武岩與豐富的珊瑚礁地形。' },
      'kinmen': { title: '金門丘陵 (花崗岩地形)', reason: '古老花崗岩地層與風化侵蝕', desc: '主要由花崗片麻岩構成，地勢起伏和緩。因土壤較貧瘠且花崗岩地層堅硬，早期農業多種植高粱與花生。' },
      'matsu': { title: '馬祖列島 (花崗岩岬灣地形)', reason: '板塊運動與海蝕作用', desc: '地勢崎嶇起伏大，海岸線曲折且多懸崖峭壁與海蝕洞，春夏季更有著名的「藍眼淚」生態景觀。' }
    };

    // --- 3. 圖片自動轉換副檔名工具 (.jpg -> .jpeg -> .png) ---
    function renderSmartImage(key) {
      return `<img src="${key}.jpg" 
                   onerror="if(this.src.endsWith('.jpg')){ this.src='${key}.jpeg'; }
                            else if(this.src.endsWith('.jpeg')){ this.src='${key}.png'; }
                            else { this.onerror=null; this.parentElement.innerHTML='🖼️ 尚未上傳 ${key}.jpg 或 ${key}.jpeg'; }" 
                   alt="${key}">`;
    }

    // --- 4. 載入 SVG 與 地圖點擊事件 ---
    const container = document.getElementById('map-container');
    const wrapper = document.getElementById('map-wrapper');
    const modalOverlay = document.getElementById('modal-overlay');

    let scale = 1, panning = false, pointX = 0, pointY = 0, start = { x: 0, y: 0 };
    let downX = 0, downY = 0; 

    fetch('map.svg')
      .then(res => res.text())
      .then(svgText => {
        container.innerHTML = svgText;
        const svg = container.querySelector('svg');
        if (svg) {
          svg.setAttribute('viewBox', '0 0 1440 2055');
          svg.removeAttribute('width'); svg.removeAttribute('height');

          svg.addEventListener('click', (e) => {
            if (Math.abs(e.clientX - downX) > 5 || Math.abs(e.clientY - downY) > 5) return;

            const path = e.target.closest('path');
            if (!path) return;

            let rawText = '';
            let curr = path;
            while(curr && curr !== svg) {
                rawText += (curr.getAttribute('id') || '') + ' ';
                rawText += (curr.getAttribute('title') || '') + ' ';
                rawText += (curr.getAttribute('name') || '') + ' ';
                if (curr.querySelector && curr.querySelector('title')) {
                    rawText += curr.querySelector('title').textContent + ' ';
                }
                curr = curr.parentNode;
            }
            
            let regionKey = null;
            let exactCountyName = '';
            
            for (const [keyword, data] of Object.entries(keywordMapping)) {
              if (rawText.includes(keyword)) {
                regionKey = data.key;
                exactCountyName = data.name;
                break;
              }
            }

            if (regionKey && geoData[regionKey]) {
              const data = geoData[regionKey];
              openModal({ 
                ...data, 
                title: `【${exactCountyName}】 ${data.title}`,
                imgHtml: renderSmartImage(regionKey)
              });
            } else {
              openModal({
                title: `未綁定區域`,
                reason: '資料庫無此區域',
                desc: `點擊成功，但尚未建立此處地形資料。(偵測到的原始標籤: ${rawText.substring(0, 30)})`,
                imgHtml: '🖼️ 暫無圖片'
              });
            }
          });
        }
      });

    // --- 5. 視窗控制 ---
    function openModal(data) {
      document.getElementById('m-title').innerText = data.title;
      document.getElementById('m-reason').innerText = `💡 成因：${data.reason}`;
      document.getElementById('m-desc').innerText = data.desc;
      document.getElementById('m-img').innerHTML = data.imgHtml;
      modalOverlay.classList.add('active');
    }
    function closeModal() { modalOverlay.classList.remove('active'); }
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

    // --- 6. 拖曳與縮放 ---
    function setTransform() { container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }

    wrapper.addEventListener('mousedown', (e) => {
      if(modalOverlay.classList.contains('active')) return;
      downX = e.clientX; downY = e.clientY; 
      start = { x: e.clientX - pointX, y: e.clientY - pointY };
      panning = true;
    });

    window.addEventListener('mouseup', () => panning = false);
    wrapper.addEventListener('mousemove', (e) => {
      if (!panning) return;
      pointX = e.clientX - start.x; pointY = e.clientY - start.y;
      setTransform();
    });

    wrapper.addEventListener('wheel', (e) => {
      if(modalOverlay.classList.contains('active')) return;
      e.preventDefault();
      const xs = (e.clientX - pointX) / scale, ys = (e.clientY - pointY) / scale;
      scale *= e.wheelDelta > 0 ? 1.15 : (1 / 1.15);
      scale = Math.max(0.4, Math.min(scale, 6));
      pointX = e.clientX - xs * scale; pointY = e.clientY - ys * scale;
      setTransform();
    }, { passive: false });
  </script>
</body>
</html>
