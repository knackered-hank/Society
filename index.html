<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺灣五大地形 課堂出拳挑戰賽</title>
    <!-- 引入 D3.js 用於繪製臺灣真實地理地圖 -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }
        body {
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #0f172a;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 1.35rem;
            color: #dc2626;
            font-weight: bold;
            margin-bottom: 20px;
            height: 35px;
            text-align: center;
        }
        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1050px;
            width: 100%;
        }

        /* 地圖卡片容器 */
        .map-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            position: relative;
            width: 440px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        svg.taiwan-map {
            width: 100%;
            height: 100%;
            background-color: #f0fdf4;
            border-radius: 12px;
        }

        /* 行政區向量樣式 */
        .county {
            fill: #cbd5e1;
            stroke: #ffffff;
            stroke-width: 1.2;
            stroke-linejoin: round;
            cursor: pointer;
            transition: fill 0.2s ease, stroke 0.2s ease, filter 0.2s ease;
        }

        /* 滑鼠移上去：區域著色 + 邊界高亮發光 (完全固定不跳動) */
        .county:hover {
            fill: #2563eb;
            stroke: #93c5fd;
            stroke-width: 2;
            filter: drop-shadow(0px 0px 8px #2563eb);
        }

        /* 載入中提示 */
        .loading-overlay {
            position: absolute;
            font-size: 1.2rem;
            color: #475569;
            font-weight: bold;
            text-align: center;
        }

        /* 右側儀表板 */
        .dashboard {
            flex: 1;
            min-width: 320px;
            background: white;
            border-radius: 20px;
            padding: 25px 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .timer-box {
            font-size: 5.5rem;
            font-weight: 900;
            color: #ef4444;
            margin: 10px 0;
            line-height: 1;
        }
        .btn-timer {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn-timer:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        .legend-box {
            margin-top: 25px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: left;
            font-size: 0.9rem;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            color: #334155;
        }

        /* 彈窗 Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 520px;
            border-radius: 24px;
            padding: 25px 30px;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }
        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #94a3b8;
        }
        .close-btn:hover { color: #0f172a; }
        .badge {
            display: inline-block;
            background: #ef4444;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 30px;
            margin-bottom: 8px;
        }
        .gesture-hint {
            font-size: 1.2rem;
            color: #1d4ed8;
            font-weight: bold;
            background: #eff6ff;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .explanation {
            font-size: 1rem;
            color: #334155;
            line-height: 1.6;
            text-align: left;
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>🗺️ 臺灣地形大挑戰：看題出拳！</h1>
    <div class="subtitle" id="hover-status">把滑鼠移到行政區上即可高亮發光...</div>

    <div class="main-layout">
        <div class="map-card">
            <div id="loading-text" class="loading-overlay">⏳ 載入臺灣真實行政區地圖中...</div>
            <svg id="taiwan-svg" class="taiwan-map" viewBox="0 0 440 600"></svg>
        </div>

        <div class="dashboard">
            <h2 style="margin: 0; color: #0f172a;">⏱️ 倒數出拳計時器</h2>
            <div class="timer-box" id="timer">5</div>
            <button class="btn-timer" onclick="startTimer()">▶️ 開始 5 秒倒數</button>
            <p style="color: #64748b; margin-top: 15px; font-size: 0.95rem;">
                先按開始倒數！歸零時手勢定格！<br>點擊地圖揭曉該區地形答案！
            </p>

            <div class="legend-box">
                <div class="legend-item">🥣 盆地：雙手捧碗</div>
                <div class="legend-item">凸 台地：T字手勢</div>
                <div class="legend-item">〰️ 丘陵：掌心微波</div>
                <div class="legend-item">🖐️ 平原：雙手對接</div>
                <div class="legend-item">⛰️ 山地：雙手合十</div>
            </div>
        </div>
    </div>

    <!-- 揭曉答案 Modal 彈窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCard()">&times;</span>
            <h2 id="m-title" style="margin: 5px 0 10px 0; color: #0f172a;">地區名稱</h2>
            <div><span class="badge" id="m-landform">地形類別</span></div>
            <div class="gesture-hint" id="m-gesture">手勢：--</div>
            <div class="explanation" id="m-desc">解釋說明載入中...</div>
        </div>
    </div>

    <script>
        const width = 440;
        const height = 600;

        // 設定臺灣地圖投影中心（經度 120.95, 緯度 23.75）
        const projection = d3.geoMercator()
            .center([120.95, 23.75])
            .scale(6800)
            .translate([width / 2, height / 2]);

        const pathGenerator = d3.geoPath().projection(projection);
        const svg = d3.select("#taiwan-svg");
        const hoverStatus = document.getElementById('hover-status');

        // 多重 CDN 備援機制，確保 100% 成功讀取臺灣邊界資料
        async function fetchTaiwanGeoJSON() {
            const urls = [
                "https://cdn.jsdelivr.net/gh/g0v/twgeojson@master/json/twCounty2010.json",
                "https://fastly.jsdelivr.net/gh/g0v/twgeojson@master/json/twCounty2010.json",
                "https://raw.githubusercontent.com/g0v/twgeojson/master/json/twCounty2010.json"
            ];

            for (let url of urls) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return await res.json();
                } catch (e) {
                    console.warn("備援載入中...", url);
                }
            }
            throw new Error("無法載入地圖資料");
        }

        fetchTaiwanGeoJSON().then(data => {
            document.getElementById("loading-text").style.display = "none";

            svg.selectAll("path")
                .data(data.features)
                .enter()
                .append("path")
                .attr("d", pathGenerator)
                .attr("class", "county")
                .on("mouseenter", function(event, d) {
                    const name = d.properties.COUNTYNAME || d.properties.name || "行政區";
                    hoverStatus.innerText = `👉 目前選擇：【${name}】`;
                })
                .on("mouseleave", function() {
                    hoverStatus.innerText = '把滑鼠移到行政區上即可高亮發光...';
                })
                .on("click", function(event, d) {
                    const name = d.properties.COUNTYNAME || d.properties.name || "該行政區";
                    openCard(name);
                });
        }).catch(err => {
            document.getElementById("loading-text").innerText = "❌ 地圖載入失敗，請檢查網路連線。";
            console.error(err);
        });

        function openCard(regionName) {
            document.getElementById('m-title').innerText = regionName;
            document.getElementById('m-landform').innerText = "主要地形考題";
            document.getElementById('m-gesture').innerText = "請比出對應地形手勢！";
            document.getElementById('m-desc').innerHTML = `<b>教學提示：</b>點選 ${regionName}，請引導學生思考該區域常見的地形（山地、丘陵、台地、平原、盆地）。`;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeCard() {
            document.getElementById('modal').style.display = 'none';
        }

        let timerInterval;
        function startTimer() {
            let count = 5;
            const timerEl = document.getElementById('timer');
            timerEl.innerText = count;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    timerEl.innerText = count;
                } else {
                    timerEl.innerText = "定格！";
                    clearInterval(timerInterval);
                }
            }, 1000);
        }
    </script>
</body>
</html>
