<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臺灣地形大挑戰：看題出拳！</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 960px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      padding: 32px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #ef4444;
      font-weight: 500;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 地圖卡片區域 */
    .map-card {
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 480px;
      border: 1px solid #e2e8f0;
      position: relative;
    }

    svg.map {
      width: 100%;
      height: 440px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.05));
    }

    .region {
      fill: #cbd5e1;
      stroke: #ffffff;
      stroke-width: 2.5;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .region:hover {
      fill: #3b82f6;
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8));
      transform: translateY(-2px);
    }

    .region.selected {
      fill: #2563eb;
    }

    /* 右側控制面板 */
    .control-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
    }

    .timer-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-display {
      font-size: 4rem;
      font-weight: 800;
      color: #ef4444;
      line-height: 1;
      margin-bottom: 16px;
      height: 70px;
      display: flex;
      align-items: center;
    }

    .btn-start {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
      max-width: 240px;
    }

    .btn-start:hover {
      background-color: #1d4ed8;
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    .instruction {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }

    /* 手勢指南圖例 */
    .gesture-box {
      margin-top: 24px;
      width: 100%;
      background: #f8fafc;
      border-radius: 8px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
      font-size: 0.88rem;
      border: 1px solid #f1f5f9;
    }

    .gesture-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #334155;
    }

    .gesture-item strong {
      color: #0f172a;
    }

    /* 答案顯示浮報彈窗 */
    .result-banner {
      margin-top: 20px;
      width: 100%;
      padding: 12px 16px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      text-align: center;
      color: #1e40af;
      font-weight: 600;
      display: none;
    }

    .result-banner.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>臺灣地形大挑戰：看題出拳！</h1>
      <p class="subtitle">將滑鼠移至縣市區域檢視高亮發光效果...</p>
    </header>

    <div class="main-grid">
      <!-- 左側 SVG 地圖 -->
      <div class="map-card">
        <svg class="map" viewBox="0 0 300 500">
          <!-- 台北盆地 -->
          <path class="region" data-name="臺北盆地" data-type="盆地" data-gesture="雙手捧碗" d="M165,60 L185,50 L195,65 L180,80 L160,75 Z"/>
          <!-- 桃園台地 -->
          <polygon class="region" data-name="桃園台地" data-type="台地" data-gesture="T字手勢" points="135,70 160,65 155,90 130,95"/>
          <!-- 雪山/中央山脈 (山地) -->
          <polygon class="region" data-name="中央山脈" data-type="山地" data-gesture="雙手合十" points="160,100 185,110 175,230 150,250 145,170"/>
          <!-- 竹苗丘陵 -->
          <polygon class="region" data-name="竹苗丘陵" data-type="丘陵" data-gesture="掌心微波" points="120,95 145,90 140,140 115,130"/>
          <!-- 台中盆地 -->
          <polygon class="region" data-name="臺中盆地" data-type="盆地" data-gesture="雙手捧碗" points="125,150 145,145 140,180 120,175"/>
          <!-- 彰化平原 -->
          <polygon class="region" data-name="彰化平原" data-type="平原" data-gesture="雙手對接" points="100,165 120,160 115,200 95,190"/>
          <!-- 嘉南平原 -->
          <polygon class="region" data-name="嘉南平原" data-type="平原" data-gesture="雙手對接" points="90,200 125,200 120,310 75,280"/>
          <!-- 埔里盆地群 -->
          <polygon class="region" data-name="埔里盆地" data-type="盆地" data-gesture="雙手捧碗" points="145,185 160,180 160,205 145,200"/>
          <!-- 阿里山山脈 -->
          <polygon class="region" data-name="阿里山山脈" data-type="山地" data-gesture="雙手合十" points="125,210 140,210 135,270 120,260"/>
          <!-- 高屏平原 -->
          <polygon class="region" data-name="屏東平原" data-type="平原" data-gesture="雙手對接" points="100,320 125,310 130,390 110,400"/>
          <!-- 恒春丘陵 -->
          <polygon class="region" data-name="恆春丘陵" data-type="丘陵" data-gesture="掌心微波" points="125,400 140,390 135,440 120,430"/>
          <!-- 宜蘭平原 -->
          <polygon class="region" data-name="宜蘭平原" data-type="平原" data-gesture="雙手對接" points="190,80 215,85 205,110 185,100"/>
          <!-- 花東縱谷平原 -->
          <polygon class="region" data-name="花東縱谷平原" data-type="平原" data-gesture="雙手對接" points="180,180 190,180 175,320 165,310"/>
          <!-- 海岸山脈 -->
          <polygon class="region" data-name="海岸山脈" data-type="山地" data-gesture="雙手合十" points="192,175 205,180 190,320 178,315"/>
        </svg>
      </div>

      <!-- 右側 控制與手勢面板 -->
      <div class="control-card">
        <div class="timer-title">
          <span>⏱️</span> 倒數出拳計時器
        </div>
        
        <div class="timer-display" id="timer">5</div>

        <button class="btn-start" id="startBtn" onclick="startTimer()">▶ 開始 5 秒倒數</button>

        <p class="instruction">
          先按開始倒數！歸零時手勢定格！<br>
          點擊地圖揭曉該地形答案！
        </p>

        <div class="result-banner" id="resultBanner">
          請點擊地圖上的區域驗證答案
        </div>

        <div class="gesture-box">
          <div class="gesture-item">
            <span>🥣</span> <strong>盆地：</strong>雙手捧碗
          </div>
          <div class="gesture-item">
            <span>凸</span> <strong>台地：</strong>T字手勢
          </div>
          <div class="gesture-item">
            <span>〰️</span> <strong>丘陵：</strong>掌心微波
          </div>
          <div class="gesture-item">
            <span>🌾</span> <strong>平原：</strong>雙手對接
          </div>
          <div class="gesture-item" style="grid-column: span 2;">
            <span>⛰️</span> <strong>山地：</strong>雙手合十
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let timerElement = document.getElementById('timer');
    let startBtn = document.getElementById('startBtn');
    let resultBanner = document.getElementById('resultBanner');
    let regions = document.querySelectorAll('.region');
    
    let countdown = 5;
    let timerId = null;

    function startTimer() {
      if (timerId !== null) clearInterval(timerId);
      
      countdown = 5;
      timerElement.textContent = countdown;
      timerElement.style.color = '#ef4444';
      startBtn.disabled = true;
      startBtn.style.opacity = '0.6';
      resultBanner.classList.remove('active');

      timerId = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          timerElement.textContent = countdown;
        } else {
          clearInterval(timerId);
          timerId = null;
          timerElement.textContent = '定格！';
          timerElement.style.color = '#22c55e';
          startBtn.disabled = false;
          startBtn.style.opacity = '1';
          
          resultBanner.textContent = '⏱️ 時間到！請比好手勢並點擊地圖揭曉答案！';
          resultBanner.classList.add('active');
        }
      }, 1000);
    }

    // 地圖區域點擊互動 logic
    regions.forEach(region => {
      region.addEventListener('click', function() {
        regions.forEach(r => r.classList.remove('selected'));
        this.classList.add('selected');

        const name = this.getAttribute('data-name');
        const type = this.getAttribute('data-type');
        const gesture = this.getAttribute('data-gesture');

        resultBanner.innerHTML = `📍 <strong>${name}</strong><br>地形：<span style="color:#2563eb;">${type}</span>（手勢：${gesture}）`;
        resultBanner.classList.add('active');
      });
    });
  </script>
</body>
</html>
