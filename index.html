<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣地形盲圖測驗 (支援縮放平移)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh; background-color: #1e293b; overflow: hidden;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: #f8fafc;
    }
    
    /* 地圖容器與縮放控制 */
    #map-wrapper {
      width: 100%; height: 100%;
      cursor: grab;
      position: relative;
    }
    #map-wrapper:active { cursor: grabbing; }
    
    #map-container {
      width: 100%; height: 100%;
      transform-origin: 0 0; /* 縮放基準點設為左上，由 JS 運算 */
    }

    /* 確保 SVG 初始大小適應螢幕 */
    svg {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    /* 互動與浮出動畫設定 */
    svg path {
      transition: fill 0.2s, filter 0.2s;
      cursor: pointer;
      stroke: #ffffff;
      stroke-width: 1px;
      pointer-events: auto;
    }
    svg path:hover {
      fill: #facc15 !important;
      filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.8));
    }

    /* 強制隱藏所有地名文字與離島，變成盲圖 */
    text, #box, 
    path[title*="連江"], path[title*="金門"], path[title*="澎湖"] {
      display: none !important;
    }

    /* 全新解答彈出視窗 (Modal) */
    #modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: none; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; transition: opacity 0.3s;
    }
    #answer-modal {
      background: #ffffff; color: #0f172a;
      padding: 30px; border-radius: 20px;
      width: 90%; max-width: 500px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      position: relative;
      transform: translateY(20px); transition: transform 0.3s;
    }
    #modal-overlay.active { display: flex; opacity: 1; }
    #modal-overlay.active #answer-modal { transform: translateY(0); }
    
    .close-btn {
      position: absolute; top: 15px; right: 20px;
      font-size: 24px; cursor: pointer; color: #64748b;
    }
    .close-btn:hover { color: #ef4444; }
    
    .modal-title { font-size: 32px; font-weight: bold; margin-bottom: 10px; color: #2563eb; }
    .modal-reason { font-size: 18px; font-weight: bold; color: #b45309; margin-bottom: 15px; background: #fef3c7; padding: 10px; border-radius: 8px;}
    .modal-desc { font-size: 16px; line-height: 1.6; margin-bottom: 20px; }
    .modal-img-placeholder {
      width: 100%; height: 200px; background: #e2e8f0; border: 2px dashed #94a3b8;
      border-radius: 10px; display: flex; justify-content: center; align-items: center;
      color: #64748b; font-weight: bold; font-size: 18px;
    }

    .hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-size: 18px; background: rgba(15, 23, 42, 0.8); padding: 10px 20px;
      border-radius: 30px; pointer-events: none; z-index: 100;
    }
    .error { color: #ef4444; padding: 20px; font-size: 20px; }
  </style>
</head>
<body>

  <!-- 解答彈出視窗 -->
  <div id="modal-overlay">
    <div id="answer-modal">
      <div class="close-btn" onclick="closeModal()">✖</div>
      <div class="modal-title" id="m-title">地形名稱</div>
      <div class="modal-reason" id="m-reason">成因簡介</div>
      <div class="modal-desc" id="m-desc">詳細介紹</div>
      <div class="modal-img-placeholder" id="m-img">🖼️ 請在此處插入您的圖片</div>
    </div>
  </div>

  <div id="map-wrapper">
    <div id="map-container"></div>
  </div>
  <div class="hint">👆 滾輪縮放地圖・按住拖曳平移・點擊區塊顯示地形教學</div>

  <script>
    // --- 題庫資料庫 (可自行修改與新增) ---
    const geoData = {
      '臺北市': {
        title: '臺北盆地',
        reason: '斷層陷落與河流沖積而成',
        desc: '四周被大屯火山群、林口臺地與雪山山脈環繞。因地形封閉，夏季容易產生悶熱的盆地效應。這裡是臺灣的政經中心。',
        imgHint: '🖼️ (建議放入臺北101或盆地空照圖)'
      },
      '臺中市': {
        title: '臺中盆地 / 大肚臺地',
        reason: '板塊擠壓與河流沖積',
        desc: '臺中盆地是臺灣最大盆地，西側邊緣隆起了大肚臺地。氣候溫和，是中部的重要農業與都會樞紐。',
        imgHint: '🖼️ (建議放入大肚臺地剖面圖)'
      },
      '苗栗縣': {
        title: '苗栗丘陵',
        reason: '河流切割與地殼抬升',
        desc: '素有「山城」之稱，地形多為起伏和緩的丘陵，非常適合種植茶葉與水果（如草莓）。',
        imgHint: '🖼️ (建議放入茶園或梯田景觀圖)'
      },
      '南投縣': {
        title: '埔里盆地 / 中央山脈',
        reason: '地層斷裂陷落',
        desc: '位於臺灣地理中心，是被群山環抱的典型盆地。水質優良，氣候宜人，周圍緊鄰高聳的中央山脈。',
        imgHint: '🖼️ (建議放入埔里盆地鳥瞰圖)'
      },
      '桃園市': {
        title: '桃園臺地',
        reason: '古石門溪沖積扇隆起',
        desc: '地表平坦但略高於海平面，因為缺乏大型河川，先民開鑿了許多「埤塘」來蓄水灌溉，形成千塘之鄉的景觀。',
        imgHint: '🖼️ (建議放入埤塘空照圖)'
      },
      // 若沒有建檔的縣市，會顯示預設文字
      'default': {
        title: '準備中', reason: '地形特徵', desc: '老師還在準備此處的詳細地理介紹喔！', imgHint: '🖼️ 圖片準備中'
      }
    };

    // --- 1. 載入 SVG 與地圖初始化 ---
    const container = document.getElementById('map-container');
    fetch('map.svg')
      .then(res => { if (!res.ok) throw new Error('找不到 map.svg'); return res.text(); })
      .then(svgText => {
        container.innerHTML = svgText;
        const svg = container.querySelector('svg');
        if (svg) {
          // 強制設定 viewBox 確保全島可見，忽略原檔寫死的寬高
          svg.setAttribute('viewBox', '0 0 1440 2055');
          svg.removeAttribute('width');
          svg.removeAttribute('height');

          // 綁定點擊事件
          const paths = svg.querySelectorAll('path');
          paths.forEach(path => {
            const countyName = path.getAttribute('title');
            if (countyName) {
              path.addEventListener('click', (e) => {
                e.stopPropagation(); // 防止觸發背景平移
                const data = geoData[countyName] || { ...geoData['default'], title: countyName };
                openModal(countyName, data);
              });
            }
          });
        }
      })
      .catch(err => container.innerHTML = `<div class="error">載入失敗：${err.message}</div>`);

    // --- 2. 視窗控制邏輯 ---
    const modalOverlay = document.getElementById('modal-overlay');
    function openModal(county, data) {
      document.getElementById('m-title').innerText = `【${county}】 ${data.title}`;
      document.getElementById('m-reason').innerText = `💡 成因：${data.reason}`;
      document.getElementById('m-desc').innerText = data.desc;
      document.getElementById('m-img').innerText = data.imgHint;
      modalOverlay.classList.add('active');
    }
    function closeModal() {
      modalOverlay.classList.remove('active');
    }
    // 點擊背景關閉視窗
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    // --- 3. 平移與縮放 (Pan & Zoom) 邏輯 ---
    const wrapper = document.getElementById('map-wrapper');
    let scale = 1, panning = false, pointX = 0, pointY = 0, start = { x: 0, y: 0 };

    function setTransform() {
      container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    // 拖曳平移
    wrapper.addEventListener('mousedown', (e) => {
      if(modalOverlay.classList.contains('active')) return;
      e.preventDefault();
      start = { x: e.clientX - pointX, y: e.clientY - pointY };
      panning = true;
    });
    wrapper.addEventListener('mouseup', () => panning = false);
    wrapper.addEventListener('mouseleave', () => panning = false);
    wrapper.addEventListener('mousemove', (e) => {
      if (!panning) return;
      pointX = e.clientX - start.x;
      pointY = e.clientY - start.y;
      setTransform();
    });

    // 滾輪縮放 (以滑鼠位置為中心)
    wrapper.addEventListener('wheel', (e) => {
      if(modalOverlay.classList.contains('active')) return;
      e.preventDefault();
      const xs = (e.clientX - pointX) / scale;
      const ys = (e.clientY - pointY) / scale;
      const delta = (e.wheelDelta ? e.wheelDelta : -e.deltaY);
      
      if (delta > 0) scale *= 1.1; // 放大
      else scale /= 1.1;           // 縮小
      
      // 限制縮放範圍
      scale = Math.max(0.5, Math.min(scale, 5));
      
      pointX = e.clientX - xs * scale;
      pointY = e.clientY - ys * scale;
      setTransform();
    }, { passive: false });
  </script>
</body>
</html>
