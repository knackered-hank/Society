<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣地形互動測驗</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh; background-color: #0f172a; overflow: hidden;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: #f8fafc;
    }
    
    #map-wrapper { width: 100%; height: 100%; cursor: grab; position: relative; }
    #map-wrapper:active { cursor: grabbing; }
    #map-container { width: 100%; height: 100%; transform-origin: 0 0; }
    svg { width: 100%; height: 100%; object-fit: contain; }

    /* 行政區互動與隱藏設定 */
    svg path {
      transition: fill 0.2s, filter 0.2s;
      cursor: pointer; stroke: #ffffff; stroke-width: 1px; pointer-events: auto;
    }
    svg path:hover {
      fill: #fcd34d !important;
      filter: drop-shadow(0 0 12px rgba(252, 211, 77, 0.8));
    }
    text, #box, path[title*="連江"], path[title*="金門"], path[title*="澎湖"] { display: none !important; }

    /* 解答彈出視窗 */
    #modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: none; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; transition: opacity 0.3s;
    }
    #answer-modal {
      background: #ffffff; color: #0f172a;
      padding: 35px; border-radius: 24px;
      width: 90%; max-width: 550px;
      box-shadow: 0 25px 30px -5px rgba(0,0,0,0.6);
      position: relative; transform: translateY(20px); transition: transform 0.3s;
    }
    #modal-overlay.active { display: flex; opacity: 1; }
    #modal-overlay.active #answer-modal { transform: translateY(0); }
    
    .close-btn {
      position: absolute; top: 20px; right: 25px;
      font-size: 28px; cursor: pointer; color: #94a3b8; transition: color 0.2s;
    }
    .close-btn:hover { color: #ef4444; }
    
    .modal-title { font-size: 34px; font-weight: bold; margin-bottom: 12px; color: #1d4ed8; }
    .modal-reason { font-size: 18px; font-weight: bold; color: #b45309; margin-bottom: 18px; background: #fef3c7; padding: 12px; border-radius: 8px;}
    .modal-desc { font-size: 18px; line-height: 1.7; margin-bottom: 25px; color: #334155; }
    .modal-img-placeholder {
      width: 100%; height: 220px; background: #e2e8f0; border: 3px dashed #cbd5e1;
      border-radius: 12px; display: flex; justify-content: center; align-items: center;
      color: #64748b; font-weight: bold; font-size: 20px; overflow: hidden;
    }

    .hint {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
      font-size: 18px; background: rgba(30, 41, 59, 0.9); padding: 12px 24px;
      border-radius: 30px; pointer-events: none; z-index: 100;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #475569;
    }
  </style>
</head>
<body>

  <div id="modal-overlay">
    <div id="answer-modal">
      <div class="close-btn" onclick="closeModal()">✖</div>
      <div class="modal-title" id="m-title">地形名稱</div>
      <div class="modal-reason" id="m-reason">成因簡介</div>
      <div class="modal-desc" id="m-desc">詳細介紹</div>
      <div class="modal-img-placeholder" id="m-img">🖼️ 請在此處插入您的圖片</div>
    </div>
  </div>

  <div id="map-wrapper">
    <div id="map-container"></div>
  </div>
  <div class="hint">👆 滾輪縮放地圖・按住拖曳平移・點擊區塊顯示地形教學</div>

  <script>
    // --- 1. 行政區對應群組設定 (點擊同群組的縣市會跳出相同的地形資料) ---
    const regionMapping = {
      '基隆市': 'keelung',
      '臺北市': 'taipei', '台北市': 'taipei', '新北市': 'taipei',
      '桃園市': 'taoyuan',
      '新竹市': 'zhumiao', '新竹縣': 'zhumiao', '苗栗縣': 'zhumiao',
      '臺中市': 'taichung', '台中市': 'taichung',
      '彰化縣': 'changhua',
      '南投縣': 'nantou',
      '雲林縣': 'jianan', '嘉義市': 'jianan', '嘉義縣': 'jianan', '臺南市': 'jianan', '台南市': 'jianan',
      '高雄市': 'kaoping', '屏東縣': 'kaoping',
      '宜蘭縣': 'yilan',
      '花蓮縣': 'huadong', '臺東縣': 'huadong', '台東縣': 'huadong'
    };

    // --- 2. 臺灣地形題庫資料庫 ---
    const geoData = {
      'keelung': {
        title: '谷灣式海岸 (岬灣地形)', reason: '丘陵沉降、海水入侵',
        desc: '海岸線曲折，多岬角與海灣，水深利於建港，因此基隆港成為北臺灣重要良港。',
        imgHint: '🖼️ 建議放入基隆海岸或港口圖'
      },
      'taipei': {
        title: '臺北盆地', reason: '斷層陷落與河流沖積',
        desc: '四周被大屯火山群、林口臺地與雪山山脈環繞。因地形封閉，夏季容易產生悶熱的「盆地效應」。',
        imgHint: '🖼️ 建議放入臺北盆地空照圖'
      },
      'taoyuan': {
        title: '桃園臺地', reason: '古石門溪沖積扇隆起',
        desc: '地勢平坦但略高於海平面。因缺乏大型河川，先民廣建「埤塘」蓄水灌溉，形成獨特的千塘之鄉景觀。',
        imgHint: '🖼️ 建議放入埤塘空照圖'
      },
      'zhumiao': {
        title: '竹苗丘陵', reason: '河川切割與地殼抬升',
        desc: '地勢起伏和緩，氣候適合茶樹生長，是臺灣東方美人茶的重要產地。',
        imgHint: '🖼️ 建議放入茶園梯田景觀圖'
      },
      'taichung': {
        title: '臺中盆地 / 大肚臺地', reason: '板塊擠壓與斷層作用',
        desc: '臺中盆地是臺灣最大盆地，其西緣隆起了大肚臺地。氣候溫和，為中部重要農業與都會樞紐。',
        imgHint: '🖼️ 建議放入大肚臺地剖面圖'
      },
      'changhua': {
        title: '彰化平原', reason: '濁水溪等河川沖積而成',
        desc: '土壤肥沃且有八堡圳灌溉，農業發達，素有「臺灣穀倉」的美譽。',
        imgHint: '🖼️ 建議放入平原稻田景觀圖'
      },
      'nantou': {
        title: '埔里盆地 / 中央山脈', reason: '斷層陷落 / 板塊擠壓',
        desc: '南投是全臺唯一不靠海的縣市，境內多高山（中央山脈），並有著名的埔里盆地與日月潭。',
        imgHint: '🖼️ 建議放入埔里或高山圖'
      },
      'jianan': {
        title: '嘉南平原', reason: '多條河川(如曾文溪)長期沖積',
        desc: '臺灣面積最大的平原！西部沿海地勢低平，常有沙洲與潟湖地形，早期多闢為鹽田或魚塭。',
        imgHint: '🖼️ 建議放入潟湖或嘉南大圳圖'
      },
      'kaoping': {
        title: '高屏平原 / 恆春半島', reason: '高屏溪沖積 / 珊瑚礁隆起',
        desc: '高屏平原是臺灣第二大平原；最南端的恆春半島則佈滿珊瑚礁石灰岩地形，熱帶氣候顯著。',
        imgHint: '🖼️ 建議放入珊瑚礁海岸圖'
      },
      'yilan': {
        title: '蘭陽平原', reason: '蘭陽溪沖積扇',
        desc: '地形呈現向海開口的畚箕狀。冬季迎東北季風，降雨豐沛，是臺灣著名的多雨地區。',
        imgHint: '🖼️ 建議放入蘭陽平原鳥瞰圖'
      },
      'huadong': {
        title: '花東縱谷 / 海岸山脈', reason: '菲律賓海板塊與歐亞板塊擠壓',
        desc: '花東縱谷夾在中央山脈與海岸山脈之間，呈狹長形平原；海岸山脈則是板塊碰撞擠壓隆起的結果。',
        imgHint: '🖼️ 建議放入花東縱谷圖'
      }
    };

    // --- 3. 載入 SVG 與事件綁定 ---
    const container = document.getElementById('map-container');
    let isDragging = false; // 判斷是否正在拖曳的標籤

    fetch('map.svg')
      .then(res => { if (!res.ok) throw new Error('找不到 map.svg'); return res.text(); })
      .then(svgText => {
        container.innerHTML = svgText;
        const svg = container.querySelector('svg');
        if (svg) {
          svg.setAttribute('viewBox', '0 0 1440 2055');
          svg.removeAttribute('width'); svg.removeAttribute('height');

          // 綁定行政區點擊 (避開拖曳誤觸)
          const paths = svg.querySelectorAll('path');
          paths.forEach(path => {
            const countyName = path.getAttribute('title');
            if (countyName) {
              path.addEventListener('click', (e) => {
                if (isDragging) return; // 如果正在拖曳，就不觸發點擊
                
                const regionKey = regionMapping[countyName];
                const data = geoData[regionKey] || { 
                  title: countyName, reason: '未分類區域', desc: '尚無資料', imgHint: '🖼️'
                };
                
                // 為了讓顯示的標題包含點擊的縣市名 + 地形名
                const displayData = { ...data, title: `【${countyName}】 ${data.title}` };
                openModal(displayData);
              });
            }
          });
        }
      })
      .catch(err => container.innerHTML = `<div style="color:red; padding:20px;">載入失敗：${err.message}</div>`);

    // --- 4. 視窗控制 ---
    const modalOverlay = document.getElementById('modal-overlay');
    function openModal(data) {
      document.getElementById('m-title').innerText = data.title;
      document.getElementById('m-reason').innerText = `💡 成因：${data.reason}`;
      document.getElementById('m-desc').innerText = data.desc;
      document.getElementById('m-img').innerHTML = data.imgHint; // 使用 innerHTML 支援未來放入 <img> 標籤
      modalOverlay.classList.add('active');
    }
    function closeModal() { modalOverlay.classList.remove('active'); }
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

    // --- 5. 修正版平移與縮放 (解決與點擊衝突) ---
    const wrapper = document.getElementById('map-wrapper');
    let scale = 1, panning = false, pointX = 0, pointY = 0, start = { x: 0, y: 0 };
    let dragStartX = 0, dragStartY = 0;

    function setTransform() {
      container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    wrapper.addEventListener('mousedown', (e) => {
      if(modalOverlay.classList.contains('active')) return;
      isDragging = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      start = { x: e.clientX - pointX, y: e.clientY - pointY };
      panning = true;
    });

    window.addEventListener('mouseup', () => panning = false);
    
    wrapper.addEventListener('mousemove', (e) => {
      if (!panning) return;
      // 如果滑鼠移動超過 3px 才判定為拖曳，避免誤觸點擊
      if (Math.abs(e.clientX - dragStartX) > 3 || Math.abs(e.clientY - dragStartY) > 3) {
        isDragging = true; 
      }
      pointX = e.clientX - start.x;
      pointY = e.clientY - start.y;
      setTransform();
    });

    wrapper.addEventListener('wheel', (e) => {
      if(modalOverlay.classList.contains('active')) return;
      e.preventDefault();
      const xs = (e.clientX - pointX) / scale;
      const ys = (e.clientY - pointY) / scale;
      const delta = (e.wheelDelta ? e.wheelDelta : -e.deltaY);
      
      if (delta > 0) scale *= 1.15; else scale /= 1.15;
      scale = Math.max(0.4, Math.min(scale, 6));
      
      pointX = e.clientX - xs * scale;
      pointY = e.clientY - ys * scale;
      setTransform();
    }, { passive: false });
  </script>
</body>
</html>
