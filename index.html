<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taiwan Map Visualization</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f8fafc;
      overflow: hidden;
    }

    #map-container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 自動套用至載入的 SVG */
    #map-container svg {
      width: 100%;
      height: 100%;
      max-width: 1440px;
      max-height: 2055px;
      
      /* 方法 A：整體縮放至 80% 並以畫布中心點為基準 */
      transform: scale(0.8);
      transform-origin: center center;
    }

    /* CSS 隱藏離島與角落畫框 (維持主島精細度) */
    #box,
    path[title*="連江"],
    path[title*="金門"],
    path[title*="澎湖"] {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="map-container"></div>

  <script>
    // 自動讀取同目錄下的原版 SVG 檔案
    fetch('Taiwan map labeled.svg')
      .then(response => {
        if (!response.ok) {
          throw new Error('找不到 Taiwan map labeled.svg 檔案');
        }
        return response.text();
      })
      .then(svgText => {
        document.getElementById('map-container').innerHTML = svgText;
      })
      .catch(error => {
        console.error('SVG 載入錯誤:', error);
      });
  </script>
</body>
</html>
