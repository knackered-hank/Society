<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺灣五大地形 課堂出拳挑戰賽</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }
        body {
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #0f172a;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 1.35rem;
            color: #dc2626;
            font-weight: bold;
            margin-bottom: 20px;
            height: 35px;
            text-align: center;
        }
        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1050px;
            width: 100%;
        }

        /* 地圖卡片容器 */
        .map-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            position: relative;
            width: 440px;
            height: 620px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* 臺灣 SVG 行政區地圖與發光效果 */
        svg.taiwan-map {
            width: 100%;
            height: 100%;
        }

        /* 預設行政區樣式 */
        .county {
            fill: #cbd5e1;
            stroke: #ffffff;
            stroke-width: 1.8;
            stroke-linejoin: round;
            cursor: pointer;
            transition: fill 0.25s ease, stroke 0.25s ease, filter 0.25s ease;
        }

        /* 滑鼠移上去時：區域著色 + 邊界高亮發光 (絕不安動/不跳動) */
        .county:hover {
            fill: #3b82f6;
            stroke: #93c5fd;
            stroke-width: 2.5;
            filter: drop-shadow(0px 0px 10px #2563eb);
        }

        /* 右側儀表板 */
        .dashboard {
            flex: 1;
            min-width: 320px;
            background: white;
            border-radius: 20px;
            padding: 25px 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .timer-box {
            font-size: 5.5rem;
            font-weight: 900;
            color: #ef4444;
            margin: 10px 0;
            line-height: 1;
        }
        .btn-timer {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn-timer:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        .legend-box {
            margin-top: 25px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: left;
            font-size: 0.9rem;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            color: #334155;
        }

        /* 彈窗 Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 520px;
            border-radius: 24px;
            padding: 25px 30px;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }
        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #94a3b8;
        }
        .close-btn:hover { color: #0f172a; }
        .badge {
            display: inline-block;
            background: #ef4444;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 30px;
            margin-bottom: 8px;
        }
        .gesture-hint {
            font-size: 1.2rem;
            color: #1d4ed8;
            font-weight: bold;
            background: #eff6ff;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .explanation {
            font-size: 1rem;
            color: #334155;
            line-height: 1.6;
            text-align: left;
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>🗺️ 臺灣地形大挑戰：看題出拳！</h1>
    <div class="subtitle" id="hover-status">把滑鼠移到行政區上即可高亮發光...</div>

    <div class="main-layout">
        <div class="map-card">
            <svg class="taiwan-map" viewBox="0 0 400 600">
                <!-- 海洋背景邊框 -->
                <rect width="400" height="600" fill="#f0fdf4" rx="15"/>

                <!-- 全臺灣 22 行政區獨立向量路徑（靜態不帶文字） -->
                <g id="counties-group">
                    <!-- 基隆市 -->
                    <path class="county" id="keelung" data-name="基隆市" d="M 285,42 L 295,40 L 298,48 L 288,52 Z"/>
                    <!-- 臺北市 -->
                    <path class="county" id="taipei" data-name="臺北市 (臺北盆地)" d="M 265,50 C 275,45 285,55 282,65 C 275,72 260,68 265,50 Z"/>
                    <!-- 新北市 -->
                    <path class="county" id="newtaipei" data-name="新北市" d="M 250,32 C 270,30 295,35 305,52 L 292,78 C 270,85 245,70 250,32 Z M 265,50 C 260,68 275,72 282,65 C 285,55 275,45 265,50 Z"/>
                    <!-- 桃園市 -->
                    <path class="county" id="taoyuan" data-name="桃園市 (桃園台地)" d="M 220,52 C 240,48 250,55 248,78 C 235,95 220,90 215,70 Z"/>
                    <!-- 新竹縣市 -->
                    <path class="county" id="hsinchu" data-name="新竹縣市" d="M 205,72 C 220,70 232,90 220,112 C 198,105 195,85 205,72 Z"/>
                    <!-- 苗栗縣 -->
                    <path class="county" id="miaoli" data-name="苗栗縣 (苗栗丘陵)" d="M 188,95 C 208,92 220,112 C 205,140 180,128 188,95 Z"/>
                    <!-- 臺中市 -->
                    <path class="county" id="taichung" data-name="臺中市" d="M 172,128 C 205,125 238,138 215,168 C 175,160 162,142 172,128 Z"/>
                    <!-- 彰化縣 -->
                    <path class="county" id="changhua" data-name="彰化縣 (平原)" d="M 148,162 C 170,158 178,175 160,195 C 142,190 140,172 148,162 Z"/>
                    <!-- 南投縣 -->
                    <path class="county" id="nantou" data-name="南投縣 (埔里盆地 / 中央山脈)" d="M 175,165 C 218,155 235,195 210,248 C 178,240 165,200 175,165 Z"/>
                    <!-- 雲林縣 -->
                    <path class="county" id="yunlin" data-name="雲林縣 (嘉南平原)" d="M 132,195 C 160,192 172,215 145,235 C 122,228 120,208 132,195 Z"/>
                    <!-- 嘉義縣市 -->
                    <path class="county" id="chiayi" data-name="嘉義縣市 (嘉南平原)" d="M 125,235 C 165,225 180,250 152,282 C 118,272 112,250 125,235 Z"/>
                    <!-- 臺南市 -->
                    <path class="county" id="tainan" data-name="臺南市 (嘉南平原)" d="M 112,275 C 148,270 158,298 135,332 C 105,322 100,295 112,275 Z"/>
                    <!-- 高雄市 -->
                    <path class="county" id="kaohsiung" data-name="高雄市" d="M 135,332 C 175,285 202,320 162,392 C 128,382 120,352 135,332 Z"/>
                    <!-- 屏東縣 -->
                    <path class="county" id="pingtung" data-name="屏東縣 (屏東平原 / 枋寮)" d="M 142,392 C 172,382 182,435 160,490 C 140,490 135,432 142,392 Z"/>
                    <!-- 宜蘭縣 -->
                    <path class="county" id="yilan" data-name="宜蘭縣 (宜蘭平原)" d="M 275,80 C 300,75 305,115 268,132 C 255,108 260,92 275,80 Z"/>
                    <!-- 花蓮縣 -->
                    <path class="county" id="hualien" data-name="花蓮縣 (中央山脈 / 海岸山脈)" d="M 235,140 C 272,130 265,255 222,282 C 210,225 222,175 235,140 Z"/>
                    <!-- 臺東縣 -->
                    <path class="county" id="taitung" data-name="臺東縣 (花東縱谷)" d="M 218,282 C 262,258 245,395 180,412 C 178,365 202,315 218,282 Z"/>
                    <!-- 澎湖縣 -->
                    <g id="penghu">
                        <circle class="county" id="penghu-1" data-name="澎湖縣" cx="55" cy="250" r="8"/>
                        <circle class="county" id="penghu-2" data-name="澎湖縣" cx="42" cy="262" r="6"/>
                        <circle class="county" id="penghu-3" data-name="澎湖縣" cx="68" cy="242" r="5"/>
                    </g>
                    <!-- 金門縣 -->
                    <g id="kinmen">
                        <path class="county" id="kinmen-1" data-name="金門縣" d="M 30,140 L 45,138 L 42,148 L 28,146 Z"/>
                    </g>
                    <!-- 連江縣 (馬祖) -->
                    <g id="matsu">
                        <circle class="county" id="matsu-1" data-name="連江縣 (馬祖)" cx="50" cy="50" r="5"/>
                        <circle class="county" id="matsu-2" data-name="連江縣 (馬祖)" cx="62" cy="45" r="4"/>
                    </g>
                </g>
            </svg>
        </div>

        <!-- 倒數計時器與顏色圖例 -->
        <div class="dashboard">
            <h2 style="margin: 0; color: #0f172a;">⏱️ 倒數出拳計時器</h2>
            <div class="timer-box" id="timer">5</div>
            <button class="btn-timer" onclick="startTimer()">▶️ 開始 5 秒倒數</button>
            <p style="color: #64748b; margin-top: 15px; font-size: 0.95rem;">
                先按開始倒數！歸零時手勢定格！<br>點擊地圖揭曉該區地形答案！
            </p>

            <div class="legend-box">
                <div class="legend-item">🥣 盆地：雙手捧碗</div>
                <div class="legend-item">凸 台地：T字手勢</div>
                <div class="legend-item">〰️ 丘陵：掌心微波</div>
                <div class="legend-item">🖐️ 平原：雙手對接</div>
                <div class="legend-item">⛰️ 山地：雙手合十</div>
            </div>
        </div>
    </div>

    <!-- 揭曉答案 Modal 彈窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCard()">&times;</span>
            <h2 id="m-title" style="margin: 5px 0 10px 0; color: #0f172a;">地區名稱</h2>
            <div><span class="badge" id="m-landform">地形類別</span></div>
            <div class="gesture-hint" id="m-gesture">手勢：--</div>
            <div class="explanation" id="m-desc">解釋說明載入中...</div>
        </div>
    </div>

    <script>
        // 為每個縣市監聽滑鼠懸停與點擊事件
        const counties = document.querySelectorAll('.county');
        const hoverStatus = document.getElementById('hover-status');

        counties.forEach(county => {
            county.addEventListener('mouseenter', (e) => {
                const name = e.target.getAttribute('data-name');
                if (name) {
                    hoverStatus.innerText = `👉 目前選擇：【${name}】`;
                }
            });

            county.addEventListener('mouseleave', () => {
                hoverStatus.innerText = '把滑鼠移到行政區上即可高亮發光...';
            });

            county.addEventListener('click', (e) => {
                const id = e.target.id.split('-')[0]; // 處理群島 id
                const name = e.target.getAttribute('data-name') || "該行政區";
                openCard(name);
            });
        });

        function openCard(regionName) {
            document.getElementById('m-title').innerText = regionName;
            document.getElementById('m-landform').innerText = "主要地形考題";
            document.getElementById('m-gesture').innerText = "請比出對應地形手勢！";
            document.getElementById('m-desc').innerHTML = `<b>教學提示：</b>點選 ${regionName}，請引導學生思考該區域常見的地形（山地、丘陵、台地、平原、盆地）。`;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeCard() {
            document.getElementById('modal').style.display = 'none';
        }

        let timerInterval;
        function startTimer() {
            let count = 5;
            const timerEl = document.getElementById('timer');
            timerEl.innerText = count;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    timerEl.innerText = count;
                } else {
                    timerEl.innerText = "定格！";
                    clearInterval(timerInterval);
                }
            }, 1000);
        }
    </script>
</body>
</html>
