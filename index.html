<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taiwan Map</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      overflow: hidden;
    }

    #map-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
      max-width: 90vw;
      max-height: 90vh;
      /* 調整縮放與置中焦點，確保南北全島都能完整顯示 */
      transform: scale(0.9);
      transform-origin: 65% 50%;
    }
  </style>
</head>
<body>

  <div id="map-container"></div>

  <script>
    // 支援檔名包含空格的 URL 編碼
    const svgFileName = encodeURIComponent('Taiwan map labeled.svg').replace(/%20/g, ' ');

    fetch(svgFileName)
      .then(response => {
        if (!response.ok) throw new Error('找不到 SVG 檔案');
        return response.text();
      })
      .then(svgText => {
        const container = document.getElementById('map-container');
        container.innerHTML = svgText;
        const svg = container.querySelector('svg');

        if (svg) {
          // 離島與不需要的關鍵字清單
          const hideKeywords = ['福建', '金門', '連江', '澎湖', '馬祖'];

          // 1. 隱藏外框線視窗與圖例
          const box = svg.querySelector('#box');
          if (box) box.style.display = 'none';

          // 2. 遍歷所有 SVG 元素，文字或屬性符合就強制隱藏
          const allElements = svg.querySelectorAll('*');
          allElements.forEach(el => {
            const id = el.id || '';
            const title = el.getAttribute('title') || '';
            const text = el.textContent || '';

            const shouldHide = hideKeywords.some(kw => 
              id.includes(kw) || title.includes(kw) || text.includes(kw)
            );

            if (shouldHide) {
              el.style.display = 'none';
            }
          });
        }
      })
      .catch(err => {
        console.error('載入失敗：', err);
      });
  </script>
</body>
</html>
