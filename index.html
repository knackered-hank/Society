<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣縣市地圖與常見名稱介紹</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f8fafc;
            color: #334155;
            overflow: hidden;
        }

        /* 左側地圖區域 */
        .map-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        svg {
            max-width: 100%;
            max-height: 90vh;
            filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.04));
        }

        /* SVG 縣市區塊樣式 */
        .county-path {
            fill: #cbd5e1;
            stroke: #ffffff;
            stroke-width: 1.5;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .county-path:hover {
            fill: #94a3b8;
            transform: translateY(-2px);
        }

        .county-path.active {
            fill: #3b82f6;
        }

        /* 右側資訊面板 */
        .info-panel {
            width: 400px;
            background: #ffffff;
            border-left: 1px solid #e2e8f0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
        }

        .info-header {
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        .county-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
        }

        .common-name-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            background-color: #eff6ff;
            color: #2563eb;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .info-content {
            font-size: 1rem;
            line-height: 1.7;
            color: #475569;
        }

        .placeholder-text {
            color: #94a3b8;
            text-align: center;
            margin-top: 50%;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- 地圖呈現區域 -->
    <div class="map-container">
        <svg id="taiwan-map" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
            <!-- 示範用向量路徑 (可替換為完整地圖 Path) -->
            <!-- 南投縣 -->
            <path id="Nantou" class="county-path" data-name="南投縣" 
                  d="M230,280 L290,270 L320,330 L280,410 L220,390 L200,330 Z" />
            <!-- 新北市/台北區域示範 -->
            <path id="Taipei" class="county-path" data-name="台北市" 
                  d="M300,80 L340,70 L350,110 L310,120 Z" />
            <!-- 連江縣(馬祖)示範 -->
            <path id="Lienchiang" class="county-path" data-name="連江縣" 
                  d="M50,50 L80,50 L80,80 L50,80 Z" />
        </svg>
    </div>

    <!-- 右側資訊顯示面板 -->
    <div class="info-panel" id="info-panel">
        <div class="placeholder-text" id="placeholder">
            👈 請點擊地圖上的縣市查看詳細介紹
        </div>

        <div id="detail-card" style="display: none;">
            <div class="info-header">
                <h2 class="county-title" id="county-name">-</h2>
                <div class="common-name-badge" id="common-name">常見名稱：-</div>
            </div>
            <div class="info-content" id="description">
                -
            </div>
        </div>
    </div>

    <script>
        // 縣市資料庫
        const countyDatabase = {
            "南投縣": {
                commonName: "埔里盆地（台灣之心）",
                description: "埔里盆地地位於南投縣中部，是由埔里、魚池、日月潭等多個陷落盆地組成的盆地群。該區四周環山，水質優良、氣候宜人，以產茭白筍、百香果及酒廠著稱。台灣的「地理中心碑」亦座落於埔里鎮，是全台灣唯一不靠海的縣市核心地理區。"
            },
            "連江縣": {
                commonName: "馬祖列島",
                description: "位於台灣海峽西北方，主要由南竿、北竿、東引與莒光等島嶼組成。擁有獨特的戰地風情、閩東石屋建築以及著名的季節限定自然景觀「藍眼淚」。"
            },
            "台北市": {
                commonName: "台北盆地",
                description: "台灣的政治、經濟與文化中心，位於台北盆地中央，四周被新北市環繞，擁有高度發達的大眾運輸系統與豐富的文教資源。"
            }
        };

        // DOM 元素擷取
        const countyPaths = document.querySelectorAll('.county-path');
        const placeholder = document.getElementById('placeholder');
        const detailCard = document.getElementById('detail-card');
        const countyNameEl = document.getElementById('county-name');
        const commonNameEl = document.getElementById('common-name');
        const descriptionEl = document.getElementById('description');

        // 綁定點擊事件
        countyPaths.forEach(path => {
            path.addEventListener('click', function() {
                // 清除所有 active 狀態
                countyPaths.forEach(p => p.classList.remove('active'));
                
                // 設定當前點擊區塊高亮
                this.classList.add('active');

                const countyName = this.getAttribute('data-name');
                const data = countyDatabase[countyName];

                if (data) {
                    // 隱藏預設提示，顯示詳細資訊
                    placeholder.style.display = 'none';
                    detailCard.style.display = 'block';

                    countyNameEl.textContent = countyName;
                    commonNameEl.textContent = `常見名稱 / 地形：${data.commonName}`;
                    descriptionEl.textContent = data.description;
                } else {
                    // 未建置資料時的退路處理
                    placeholder.style.display = 'none';
                    detailCard.style.display = 'block';
                    
                    countyNameEl.textContent = countyName;
                    commonNameEl.textContent = "常見名稱：暫無資料";
                    descriptionEl.textContent = "尚無該縣市的詳細介紹資料。";
                }
            });
        });
    </script>
</body>
</html>
